name: Validate course

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            libcairo2-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgit2-dev \
            libglpk-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            libpng-dev \
            libssl-dev \
            libtiff-dev \
            libxml2-dev \
            libxt-dev \
            libbz2-dev \
            liblzma-dev \
            libzstd-dev \
            pandoc \
            zlib1g-dev

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check environment and deterministic data
        run: |
          Rscript scripts/check_environment.R
          Rscript scripts/generate_synthetic_data.R --check

      - name: Run R smoke tests
        run: Rscript scripts/smoke_test_modules_01_03.R

      - name: Validate source repository
        run: |
          python3 scripts/validate_repository.py
          if [ -f scripts/validate_instructor.py ]; then
            python3 scripts/validate_instructor.py
          fi

      - name: Render Quarto site
        run: quarto render

      - name: Validate rendered site
        run: python3 scripts/check_rendered_site.py
